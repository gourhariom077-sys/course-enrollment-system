databaseChangeLog:
  - changeSet:
      id: 002-create-instructors-table
      author: gourhariom (generated)
      changes:
        - createTable:
            tableName: instructors
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_instructor_email
              - column:
                  name: phone
                  type: VARCHAR(15)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-2-migrate-existing-instructor-names
      author: gourhariom (generated)
      changes:
        - insert:
            tableName: instructors
            columns:
              - column:
                  name: name
                  value: "Dr. Sharma"
              - column:
                  name: email
                  value: "dr.sharma@example.edu"
        - insert:
            tableName: instructors
            columns:
              - column:
                  name: name
                  value: "Dr. Verma"
              - column:
                  name: email
                  value: "dr.verma@example.edu"

  - changeSet:
      id: 002-3-add-instructor-id-to-courses
      author: gourhariom (generated)
      changes:
        - addColumn:
            tableName: courses
            columns:
              - column:
                  name: instructor_id
                  type: BIGINT

  - changeSet:
      id: 002-4-backfill-instructor-id
      author: gourhariom (generated)
      changes:
        - sql:
            sql: >
              UPDATE courses
              SET instructor_id = instructors.id
              FROM instructors
              WHERE courses.instructor_name = instructors.name

  - changeSet:
      id: 002-5-enforce-instructor-id-not-null-and-fk
      author: gourhariom (generated)
      changes:
        - addNotNullConstraint:
            tableName: courses
            columnName: instructor_id
            columnDataType: BIGINT
        - addForeignKeyConstraint:
            baseTableName: courses
            baseColumnNames: instructor_id
            referencedTableName: instructors
            referencedColumnNames: id
            constraintName: fk_courses_instructor

  - changeSet:
      id: 002-6-drop-instructor-name-column
      author: gourhariom (generated)
      changes:
        - dropColumn:
            tableName: courses
            columnName: instructor_name